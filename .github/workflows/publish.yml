on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: Render and publish

permissions:
  contents: write

concurrency:
  group: publish-${{ github.event_name != 'pull_request' || github.run_id }}

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

      - name: Read the data version
        id: version
        run: echo "h2k=$(sed -n 's/^h2k_version <- "\(.*\)"/\1/p' R/helpers.R)" >> "$GITHUB_OUTPUT"

      # The compilation zip is about 280 MB; download it only when the version changes.
      - name: Cache data
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ steps.version.outputs.h2k }}-${{ hashFiles('R/helpers.R') }}
          restore-keys: data-${{ steps.version.outputs.h2k }}-

      - name: Download and cache data
        run: |
          source("R/helpers.R")
          checkVersions()
          D <- getHydro2k()
          regions <- getAr6Regions()
        shell: Rscript {0}

      - name: Render
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      - name: Render and publish to gh-pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
